name: Build & deploy to GitHub Pages

# Rebuilds the site (fetching live weather + Formula1.com results at build time),
# maintains a rollback-able version history, and publishes to GitHub Pages.
on:
  push:
    branches: [main]
  schedule:
    # Race-weekend window: Thu–Mon, every 2h from 06:00–20:00 UTC (covers the
    # 09:00–18:00-ish EEST/CEST session window). Thursday is included because
    # that is when the FIA publishes a round's first documents — the Race
    # Director's event notes and scrutineering papers — which is prep material
    # for Friday running.
    - cron: "0 6-20/2 * * 4,5,6,0,1"
    # Midweek, twice a day. The paddock's biggest stories routinely break on a
    # Tuesday or Wednesday: the Albon/Williams re-signing landed on Tue 18 Aug
    # 2026 and Hadjar's wrist injury on Wed 19 Aug, and with the schedule
    # running Thu–Mon only, neither was picked up until Thursday morning. Two
    # runs a day is enough to keep the news feed current without the weekend
    # cadence, since there is no session timing or weather to chase.
    - cron: "0 8,16 * * 2,3"
  workflow_dispatch: {}

# One deployment at a time. Do NOT cancel in progress — a cancelled run could
# interrupt the history push and corrupt the version store.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write      # push the site-history branch (version store) + data/ enrichment
  pages: write         # deploy to Pages
  id-token: write      # Pages OIDC

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Refresh season calendar (Mondays / manual runs)
        # Session times, circuit stats and track maps occasionally change as F1
        # confirms details for later rounds. Re-scraping weekly keeps every
        # upcoming GP page current without touching the build path, which stays
        # offline-safe and stdlib-only.
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%u)" = "1" ]; then
            python3 calendar.py
          else
            echo "Skipping calendar refresh (not Monday, not a manual run)."
          fi

      - name: Auto-enrich (article cards + FIA decision structuring)
        # Extracts new F1.com / The Race articles into news cards and structures
        # new FIA decision PDFs into penalty rows. GitHub Models was retired in
        # July 2026, so CI uses the deterministic fallback; the separate Copilot
        # agentic workflow performs the critical cross-page editorial audit. Only the
        # active window (live weekend, the next one once it's close, and the race
        # just finished) is processed. Item-level failures are skipped, leaving
        # curated content untouched.
        #
        # --max is well above the default 6. Driver-market news does not arrive
        # evenly: a contract extension, an injury call-up and a re-signing can all
        # break within a couple of hours, and a cap of 6 silently defers the rest
        # to a later run — which on a Thursday means they are missing from the page
        # for the run that matters. The deterministic extraction is inexpensive.
        continue-on-error: true
        env:
          LLM_FAKE: "1"
        run: |
          python3 -m pip install --quiet pypdf
          python3 enrich.py --max 25

      - name: FastF1 pace analysis (fastest laps, long runs, speed/delta charts)
        # Pulls real lap-timing + telemetry for completed sessions of the active
        # GP via FastF1 (https://docs.fastf1.dev/) and renders it as a "Pace
        # analysis" section on the Results page: fastest-lap vs. theoretical
        # optimal-lap leaderboard, clean long-run pace by tyre stint, and
        # speed/delta trace charts. --active limits this to the live/just-
        # finished GP so a full-season run doesn't happen every 2 hours.
        # continue-on-error because FastF1's upstream (F1 live timing / Ergast)
        # can be slow or briefly unavailable — this must never block the rest
        # of the build.
        continue-on-error: true
        run: |
          python3 -m pip install --quiet fastf1 pandas numpy
          python3 fastf1_analysis.py --active

      - name: Backfill Formula1.com headlines and dates
        # Formula1.com's listing page exposes only a URL slug, so a card can be
        # stored with a de-hyphenated slug for a title and no publication date.
        # Undated cards cannot be ordered against the rest of the feed, which is
        # how genuinely breaking stories ended up below week-old previews. This
        # repairs any such card from the article page itself and costs no model
        # calls, so it is safe to run every time.
        continue-on-error: true
        run: python3 backfill_meta.py

      - name: Persist enrichment data
        # Commit data/ (calendar, news_auto.json, penalties_auto.json, _seen.json)
        # and any newly downloaded track maps back to main so the incremental cache
        # survives to the next run. A push made with the default GITHUB_TOKEN does
        # NOT trigger another workflow run (no loop).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain data assets_src 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data assets_src
            git commit -qm "auto-enrichment $(date -u +%FT%TZ)"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          else
            echo "No enrichment changes to persist."
          fi

      - name: Build site (fetches live weather + results)
        run: python3 build.py

      - name: Restore version history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf public
          if git clone --depth=1 --branch site-history \
               "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" public 2>/dev/null; then
            rm -rf public/.git
            echo "Restored existing version history."
          else
            mkdir -p public
            echo "No history branch yet — starting fresh."
          fi

      - name: Apply versioning (pin only material changes)
        # Each build is now ~240 pages, so every retained snapshot is 240 more files
        # for the Pages backend to process. 8 keeps a useful rollback depth without
        # pushing the deployment past its timeout.
        run: python3 versioning.py site public --threshold 3 --keep 8

      - name: Persist version history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd public
          git init -q -b site-history
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "site history $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site-history

      - name: Trim the Pages upload
        # .raw is an HTML-only mirror used purely for the next run's diff. It has
        # just been persisted to the site-history branch, so it does not need to be
        # published — dropping it saves ~240 files from the deployment.
        run: rm -rf public/.raw

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000

      - name: Wait before retrying deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Retry deployment
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
